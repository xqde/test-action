name: releases

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  

permissions:
  contents: write

jobs:
  release-linux-amd64:
    name: release linux/amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: chihqiang/sshfwd
          ref: main
        
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'

      - name: Run Go Multi-Platform Build Action
        id: build
        uses: chihqiang/gobuild-action@develop
        with:
          bin_name: sshfwd
          version: 0.0.1
  
