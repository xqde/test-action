name: go build

on:
  release:
    types: [ created ]

permissions:
  contents: write
  packages: write

jobs:
  release-linux-amd64:
    name: release linux/amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: chihqiang/sshfwd
          ref: main

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'

      - name: Run Go Multi-Platform Build Action
        id: build
        uses: chihqiang/gobuild-action@main
        with:
          bin_name: sshfwd
          version: ${{ github.ref_name }}
          add_files: |
            README.md
            LICENSE
          dist_root_path: dist

      - name: Upload release assets
        uses: chihqiang/upload-asset-action@develop
        with:
          repo: xqde/sshfwd
          github_token: ${{ secrets.GH_TOKEN }}
          files: ${{ env.GOBUILD_FILES }}
