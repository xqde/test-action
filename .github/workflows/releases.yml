name: go build

on:
  release:
    types: [ created ]

permissions:
  contents: write
  packages: write

jobs:
  release-linux-amd64:
    name: release linux/amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload release assets
        uses: chihqiang/upload-asset-action@develop
