name: test-upload-only
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create test files
        run: |
          mkdir -p dist
          echo "hello world" > dist/test-app.txt
          sha256sum dist/test-app.txt > dist/test-app.sha256

      - name: Upload test assets
        uses: ./.github/actions/upload-asset
        with:
          files: |
            dist/test-app.txt
            dist/*.sha256
